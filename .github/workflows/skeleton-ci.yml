name: Squishimallows – Skeleton CI

on:
  push:
    branches: [main, jose-dev, joseangel-dev]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Frontend build ────────────────────────────────────────────
  frontend:
    name: Frontend – Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://squishimallows.vercel.app

  # ── 2. Python scripts validation ─────────────────────────────────
  scripts:
    name: Scripts – Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/config.py
          python -m py_compile scripts/generate_users.py
          python -m py_compile scripts/generate_sessions.py
          python -m py_compile scripts/generate_search_events.py
          python -m py_compile scripts/generate_product_views.py
          python -m py_compile scripts/generate_category_events.py
          python -m py_compile scripts/generate_cart_events.py
          python -m py_compile scripts/generate_orders.py
          python -m py_compile scripts/generate_order_items.py
          python -m py_compile scripts/seed.py
          python -m py_compile scripts/export.py
          echo "All scripts OK"

  # ── 3. Repository structure check ────────────────────────────────
  structure:
    name: Repo – Required files check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          files=(
            "README.md"
            "database/schema.sql"
            "scripts/requirements.txt"
            "scripts/seed.py"
            "scripts/export.py"
            "sample_data/users.csv"
            "sample_data/products.csv"
            "sample_data/orders.csv"
            "sample_data/squishimallows_data.xlsx"
            "frontend/package.json"
            "qa/checklist.md"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=$((missing + 1))
            else
              echo "OK: $f"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "$missing required file(s) missing"
            exit 1
          fi
          echo "All required files present"
